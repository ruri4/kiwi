[package]
name = "llm-chat"
version = "0.1.0"
edition = "2024"
description = "A minimal terminal client for OpenAI-compatible streaming chat endpoints"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
dotenvy = "0.15"
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }
unicode-width = "0.2"
